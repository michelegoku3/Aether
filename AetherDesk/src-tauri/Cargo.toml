[package]
name = "aether_desk"
version = "1.4.3"
description = "AetherDesk - Professional Steam & Game Management Interface"
authors = ["migo3"]
edition = "2021"
# std::fs advisory locking is used by settings/config/game transactions.
rust-version = "1.89"

[[bin]]
name = "AetherDesk"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "^2", features = [] }

[dependencies]
# Keep the Rust runtime on the same major/minor line as @tauri-apps/api.
tauri = { version = "~2.11.0", features = ["devtools"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json"] }
# Minimal tokio surface actually used (join!/select! macros, spawn, JoinSet,
# sync::{oneshot, Semaphore}, time::{timeout, sleep}, net::{TcpListener,
# TcpStream}, io::{AsyncReadExt, AsyncWriteExt}): "full" also builds
# fs/io-std/process/signal, which nothing uses.
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time", "net", "io-util"] }
sysinfo = "0.30"
# Default features pull in `zlib-ng` (via libz-ng-sys, built by cmake): on
# Windows its Debug build links the DLL runtime (/MDd → MSVCRTD), while every
# other object in a `cargo test` build uses /MD, hence
# `LNK4098: la libreria predefinita 'MSVCRTD' è in conflitto`. The pure-Rust
# `deflate` backend (miniz_oxide) has no C toolchain dependency and reads the
# same provider archives; zopfli (write-side "deflate-zopfli") was never needed.
zip = { version = "1.0", default-features = false, features = ["aes-crypto", "bzip2", "deflate", "deflate64", "lzma", "time", "zstd"] }
unrar = "0.5"
sevenz-rust2 = { version = "0.21", features = ["aes256"] }
dirs = "6"
tauri-plugin-dialog = "2"
url = "2"
regex = "1"
roxmltree = "0.20"
# Lossless shared editor for DLL configuration (already in the dependency graph).
toml_edit = "0.25"
once_cell = "1"
base64 = "0.22"
rand = "0.8"
sha2 = "0.10"
# Native OS directory events for the stplug-in Library watcher. The callback
# only queues work; debounce and all application logic remain in core code.
notify = "8.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "ico", "tiff", "webp"] }

# DLL version is read directly from the PE version resource inside the .dll files
# (Windows-only API; the DLL domain is Windows-only by design).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem", "Win32_System_SystemInformation", "Win32_Foundation", "Win32_UI_Shell", "Win32_Security_Cryptography"] }
# Safe registry access for Steam InstallPath auto-detection (single-purpose,
# well-maintained crate; keeps resolve.rs free of unsafe Win32 plumbing).
# 0.55 (not 0.50): unifies with the copy already pulled by embed-resource, so
# the graph keeps ONE winreg on windows-sys 0.59 instead of a second copy on
# the 0.48 chain. Only the stable RegKey API is used (predef/open_subkey/get_value).
winreg = "0.55"

[dev-dependencies]
tempfile = "3"

# ----------------------------------------------------------------------------
# Lint policy (applicata da `cargo clippy -- -D warnings` in build.cmd e CI).
# Dichiararla qui e non nella riga di comando la rende identica ovunque:
# IDE (rust-analyzer), build locale, GitHub Actions.
#
#   rust: codice morto / import inutilizzati / unsafe senza commento SAFETY
#   clippy::all        correttezza + stile + complessita' + perf (default)
#   clippy::pedantic   opt-in selettivo sotto: solo quelli che trovano bug
#
# `allow` motivati: il backend converte ogni errore in String al confine IPC,
# quindi `module_name_repetitions`/`too_many_lines` sarebbero solo rumore
# finche' non e' completata la migrazione a DeskError.
# ----------------------------------------------------------------------------
[lints.rust]
dead_code = "warn"
unused_imports = "warn"
unused_must_use = "deny"
unreachable_pub = "allow"
unsafe_op_in_unsafe_fn = "warn"
# Richiede `// SAFETY:` sopra ogni blocco unsafe (11 nel codice: DPAPI, Win32).
# Clippy lo verifica tramite undocumented_unsafe_blocks sotto.

[lints.clippy]
all = { level = "warn", priority = -1 }
# --- pedantic selezionati: bug reali, non stile ---
undocumented_unsafe_blocks = "warn"
await_holding_lock = "deny"          # std::Mutex tenuto attraverso .await = deadlock tokio
await_holding_refcell_ref = "deny"
large_futures = "warn"
needless_pass_by_value = "warn"
redundant_clone = "warn"
unnecessary_wraps = "warn"
unused_async = "warn"                # fn async che non awaita nulla
implicit_clone = "warn"
cast_possible_truncation = "warn"    # u64 -> u32 silenzioso su AppID/size
manual_let_else = "warn"
semicolon_if_nothing_returned = "warn"
# --- rumore noto, disattivato con motivo ---
too_many_arguments = "allow"         # comandi Tauri con molti parametri
module_name_repetitions = "allow"
too_many_lines = "allow"             # orchestratori legacy: il limite rigido incentiva split artificiali
missing_errors_doc = "allow"
missing_panics_doc = "allow"
