[package]
name = "aether_desk"
version = "1.0.0"
description = "AetherDesk - Professional Steam & Game Management Interface"
authors = ["Aether Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "^2", features = [] }

[dependencies]
tauri = { version = "^2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
sysinfo = "0.30"
zip = "1.0"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
url = "2"
regex = "1"
