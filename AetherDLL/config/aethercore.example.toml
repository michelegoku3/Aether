# AetherCore configuration.
#
# Copy this file to <Steam>\aethercore\aethercore.toml and edit as needed.
# Every key is optional; omitted keys fall back to the documented defaults.

[log]
# Minimum level written to aethercore\main.log.
# One of: "trace", "debug", "info", "warn", "error", "off".
level = "trace"

# Session logging: when true, saves the previous session's main.log as main.log.last
# upon Steam/AetherCore startup, starting a clean main.log for the current session.
keep_last_session = true

[lua]
# Extra directories scanned for *.lua manifest scripts, in addition to the
# default <Steam>\config\stplug-in. These directories are also watched for
# hot-reload (add/remove a .lua to add/remove a game without restarting Steam).
extra_paths = []

# Extra hosts the lcHttpGet() binding may reach, on top of the built-in
# baseline (raw.githubusercontent.com, cdn.jsdelivr.net, manifesthub). Exact,
# case-insensitive host match; no wildcards. Also used by Lua-driven runtime
# features such as seteticketurl() backend POSTs.
http_allowlist = []

[network]
# Optional override for pattern downloads. Placeholders {subdir} and {sha} are
# substituted at runtime. Leave empty to use the built-in mirror chain.
pattern_mirror = ""

[manifest_fetch]
# HTTP fallback for depot manifest request codes Steam refuses for fake-owned
# depots. URL templates accept {gid}, {appid}, {depotid}. The body may be a bare
# decimal code or JSON with a digit-string field such as "content".
#
# If this section is omitted, AetherCore uses the built-in default chain:
#   1. https://manifest.opensteamtool.com/{gid}
#   2. https://manifest.steam.run/api/manifest/{gid}
#   3. http://gmrc.wudrm.com/manifest/{gid}
#
# Uncomment urls=[] to disable the bridge explicitly.
# urls = []
# You may also override with a custom chain:
# urls = ["https://manifest.opensteamtool.com/{gid}"]
# Single-URL legacy form is also accepted:
# url = "https://manifest.opensteamtool.com/{gid}"
# Limit fetches to these hosts (default mirrors shown here).
# trusted_hosts = ["manifest.opensteamtool.com", "manifest.steam.run", "gmrc.wudrm.com"]
# Per-request wall-clock budget before falling through to Steam's original reply.
timeout_sec = 12

[presence]
# Unified friends/UI presence (with AND without -aetheronline).
# Does NOT change GetAppIDForCurrentPipe / multiplayer session identity.
#
# inject_local: stage/patch local PersonaState for Lua-managed non-owned games
#   so the local client shows real app id + name instead of generic "Online".
inject_local = true
# always_extra_info: always fill GamesPlayed.game_extra_info with the display
#   name when known. Under -aetheronline, game_id stays 480 and extra_info carries
#   the real title; without -aetheronline the game_id is already real and this is
#   cosmetic polish on the same pipeline.
always_extra_info = true
# aetheronline_persona_patch: rewrite inbound PersonaState friend entries that
#   still show Spacewar/480 while an AetherOnline session is active.
aetheronline_persona_patch = true

# custom_game_name: optional custom game name sent in game_extra_info to friends.
# When set (non-empty), friends on Steam see this exact title when you are in-game.
# Leave empty ("") to show the real title resolved from Steam.
custom_game_name = ""

# showonline_broadcast: for masked sessions (-showonline / -aetheronline), rewrite
# the outbound presence so the server announces Spacewar/480 with the REAL
# the real appid hidden in game_data_blob (default, docs/05 §10) — raw bytes
# the CM recycles into Friend.game_data_blob, never rendered by any client UI:
# vanilla friends see only the plain name from game_extra_info/game_name.
# When appid_blob=false the appid rides instead as a suffix in game_extra_info
# (see suffix_invisible below) for receivers on older builds.
showonline_broadcast = true

# showonline_apps: appids that activate a -showonline presence session WITHOUT
# touching the game's command line (docs/05 §11). Preferred over the legacy
# "-showonline" Steam launch option: some games hard-crash when ANY unknown
# argument reaches their argv/launch-option surface (measured: Selene
# ~Apoptosis~, Z.A.T.O. app 4122860 — both exit seconds after launch with a
# launch argument present). AetherDesk maintains this list; the DLL re-reads
# the file at every game launch, so no Steam restart is needed.
showonline_apps = []

# aetheronline_apps: appids that activate the FULL AetherOnline integration (process
# masked as Spacewar/480 + friend presence), again with a clean command line
# (docs/05 §12). AetherOnline is a superset of showonline; an app belongs to ONE
# of the three lists at a time.
aetheronline_apps = []

# exclude_apps: hard opt-out. The DLL ignores these apps entirely — no
# presence, no masking — and exclude beats every other list AND any legacy
# argv token still sitting in Steam launch options.
exclude_apps = []

# default_mode: policy for apps in NONE of the lists (intention over
# enumeration — no need to materialise your whole library into an array):
#   "none"       -> only explicitly listed apps get Aether behaviour
#   "showonline" -> every launch broadcasts "now playing" to your friends
default_mode = "none"

# appid_blob: encode the appid into GamePlayed.game_data_blob (field 8; CM
# recycles it as Friend.game_data_blob, field 60). Deterministic, invisible to
# vanilla friends in EVERY sense (no tofu, no " | appid" text).
appid_blob = true

# suffix_invisible: fallback encoder when appid_blob=false. Encodes
# " | <appid>" as U+200B + 6 Variation Selectors. MEASURED on hardware
# 2026-08-24: Steam's friends UI renders those as tofu rectangles (its font
# lacks the glyphs) — do not rely on it; kept for legacy interop only. With
# false and appid_blob=false the suffix is the visible ASCII " | <appid>".
suffix_invisible = false

# friend_appid_from_name: when a friend is masked (Spacewar/480), rebuild the
# real app id locally — first from game_data_blob / the appid suffix (exact),
# then from the title via the configured-library reverse lookup. Purely local
# rewrite on THIS pc: it restores the real game icon in your friends list.
friend_appid_from_name = true
