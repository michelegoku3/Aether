# Technical false positives only. The codebase is English-only, so no
# natural-language allowlist lives here. Each entry below was verified
# against a real use; removing any of them reports typos false positives.
# In particular `seh` must stay: auto-"correcting" it to `she` once
# corrupted SEH (Structured Exception Handling) references in code and docs.
[default.extend-words]
BA = "BA"     # x86 opcode byte in AetherDLL byte-pattern signatures
fo = "fo"     # Fallout short aliases (fo4/fo76) and RFC 4648 test vectors
SEH = "SEH"   # Structured Exception Handling (Windows)
seh = "seh"   # lowercase form, same as above
