name: Build and Release Aether

on:
  push:
    tags:
      # Stable release streams:
      #   desk-1.0.0 / desk-v1.0.0 -> AetherDesk native app release
      #   dll-1.0.0  / dll-v1.0.0  -> AetherDLL payload release
      # Testing streams (prefix t): tdesk-* / tdll-*. There is at most one of
      # each at a time; they are only surfaced when "Enable test updates" is ON.
      - 'desk-*'
      - 'dll-*'
      - 'tdesk-*'
      - 'tdll-*'

jobs:
  release-desk:
    name: Build and Release AetherDesk
    if: startsWith(github.ref_name, 'desk-') || startsWith(github.ref_name, 'tdesk-')
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Extract Desk Version From Tag
        id: version
        shell: pwsh
        run: |
          # Strip the optional testing prefix (t) and the 'v', e.g. tdesk-v1.2.3 -> 1.2.3
          $version = "${{ github.ref_name }}" -replace '^t?desk-v?', ''
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: AetherDesk/package-lock.json

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache Setup
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./AetherDesk/src-tauri -> target

      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: AetherDesk

      - name: Sync App Version
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"

          $confPath = "AetherDesk/src-tauri/tauri.conf.json"
          $conf = Get-Content $confPath -Raw | ConvertFrom-Json
          $conf.version = $version
          $conf | ConvertTo-Json -Depth 20 | Set-Content $confPath

          $pkgPath = "AetherDesk/package.json"
          $pkg = Get-Content $pkgPath -Raw | ConvertFrom-Json
          $pkg.version = $version
          $pkg | ConvertTo-Json -Depth 20 | Set-Content $pkgPath

          $cargoPath = "AetherDesk/src-tauri/Cargo.toml"
          $cargo = Get-Content $cargoPath -Raw
          $cargo = $cargo -replace '(?m)^version\s*=\s*"[^"]+"', "version = `"$version`""
          Set-Content $cargoPath $cargo

      - name: Build AetherDesk Binary
        shell: pwsh
        working-directory: AetherDesk
        run: npm run tauri build

      - name: Assemble Portable ZIP
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $root = "AetherDesk"
          $staging = "$root/build/portable/AetherDesk"
          if (Test-Path $staging) { Remove-Item -Recurse -Force $staging }
          New-Item -ItemType Directory -Force -Path $staging | Out-Null

          Copy-Item "$root/src-tauri/target/release/AetherDesk.exe" "$staging/AetherDesk.exe"
          Copy-Item -Recurse "$root/src-tauri/ExternalTools" "$staging/ExternalTools"

          # Seed default themes/wallpapers into the portable folder.
          New-Item -ItemType Directory -Force -Path "$staging/AetherData/config/themes" | Out-Null
          New-Item -ItemType Directory -Force -Path "$staging/AetherData/config/wallpapers" | Out-Null
          Copy-Item "$root/src-tauri/assets/defaults/themes/*.css" "$staging/AetherData/config/themes"
          Copy-Item "$root/src-tauri/assets/defaults/wallpapers/*" "$staging/AetherData/config/wallpapers"

          $zip = "$root/build/portable/AetherDesk-$version.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path $staging -DestinationPath $zip -Force
          if (!(Test-Path $zip)) {
            throw "Portable ZIP not found: $zip"
          }
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item $zip "release/$([System.IO.Path]::GetFileName($zip))"
          @{
            component  = "AetherDesk"
            version    = $version
            tag        = "${{ github.ref_name }}"
            portable   = $true
            published_at = (Get-Date).ToUniversalTime().ToString("o")
          } | ConvertTo-Json | Set-Content "release/latest-desk.json"

      - name: Publish AetherDesk Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: AetherDesk ${{ steps.version.outputs.version }}
          body: Automated AetherDesk portable release compiled on GitHub Actions.
          draft: false
          prerelease: false
          files: |
            release/AetherDesk-${{ steps.version.outputs.version }}.zip
            release/latest-desk.json

  release-dll:
    name: Build and Release AetherDLL
    if: startsWith(github.ref_name, 'dll-') || startsWith(github.ref_name, 'tdll-')
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Extract DLL Version From Tag
        id: version
        shell: pwsh
        run: |
          # Strip the optional testing prefix (t) and the 'v', e.g. tdll-v0.9.8 -> 0.9.8
          $version = "${{ github.ref_name }}" -replace '^t?dll-v?', ''
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Configure AetherDLL
        run: cmake --preset x64-Release
        working-directory: AetherDLL

      - name: Build AetherDLL
        run: cmake --build --preset x64-Release
        working-directory: AetherDLL

      - name: Package AetherDLL Zip
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $source = "AetherDLL/out/build/x64-Release/out/Release"
          if (!(Test-Path $source)) {
            throw "DLL output folder not found: $source"
          }
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path "$source/*" -DestinationPath "release/AetherDLL-$version.zip" -Force
          @{
            component = "AetherDLL"
            version = $version
            tag = "${{ github.ref_name }}"
            published_at = (Get-Date).ToUniversalTime().ToString("o")
          } | ConvertTo-Json | Set-Content "release/latest-dll.json"

      - name: Publish DLL Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: AetherDLL ${{ steps.version.outputs.version }}
          body: Automated AetherDLL release compiled on GitHub Actions.
          draft: false
          prerelease: false
          files: |
            release/AetherDLL-${{ steps.version.outputs.version }}.zip
            release/latest-dll.json
