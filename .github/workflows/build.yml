name: Build and Release Aether

on:
  push:
    tags:
      # Two independent release streams:
      #   desk-1.0.0 / desk-v1.0.0 -> AetherDesk native app release
      #   dll-1.0.0  / dll-v1.0.0  -> AetherDLL payload release
      - 'desk-*'
      - 'dll-*'

jobs:
  release-desk:
    name: Build and Release AetherDesk
    if: startsWith(github.ref_name, 'desk-')
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Desk Version From Tag
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^desk-v?', ''
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: AetherDesk/package-lock.json

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache Setup
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./AetherDesk/src-tauri -> target

      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: AetherDesk

      - name: Sync App Version and Updater Public Key
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $pubkey = "${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}"

          if ([string]::IsNullOrWhiteSpace($pubkey)) {
            throw "Missing GitHub secret TAURI_UPDATER_PUBLIC_KEY"
          }

          # Use Node instead of direct PowerShell property assignment because older
          # repository versions may not have plugins.updater/createUpdaterArtifacts yet.
          # This creates every missing nested object safely.
          @'
          const fs = require('fs');

          const version = process.env.AETHER_VERSION;
          const pubkey = process.env.AETHER_UPDATER_PUBKEY;

          const tauriConfPath = 'AetherDesk/src-tauri/tauri.conf.json';
          const tauriConf = JSON.parse(fs.readFileSync(tauriConfPath, 'utf8'));

          tauriConf.version = version;
          tauriConf.bundle ??= {};
          tauriConf.bundle.createUpdaterArtifacts = true;
          tauriConf.plugins ??= {};
          tauriConf.plugins.updater ??= {};
          tauriConf.plugins.updater.pubkey = pubkey;
          tauriConf.plugins.updater.endpoints ??= [];
          tauriConf.plugins.updater.windows ??= {};
          tauriConf.plugins.updater.windows.installMode ??= 'passive';

          fs.writeFileSync(tauriConfPath, JSON.stringify(tauriConf, null, 2));

          const pkgPath = 'AetherDesk/package.json';
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
          pkg.version = version;
          fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2));
          '@ | Set-Content sync-aetherdesk-version.cjs

          $env:AETHER_VERSION = $version
          $env:AETHER_UPDATER_PUBKEY = $pubkey
          node sync-aetherdesk-version.cjs
          Remove-Item sync-aetherdesk-version.cjs

          $cargoPath = "AetherDesk/src-tauri/Cargo.toml"
          $cargo = Get-Content $cargoPath -Raw
          $cargo = $cargo -replace '(?m)^version\s*=\s*"[^"]+"', "version = `"$version`""
          Set-Content $cargoPath $cargo

      - name: Build and Package Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AetherDesk ${{ steps.version.outputs.version }}'
          releaseBody: 'Automated AetherDesk release compiled and signed on GitHub Actions.'
          releaseDraft: false
          prerelease: false
          projectPath: ./AetherDesk

  release-dll:
    name: Build and Release AetherDLL
    if: startsWith(github.ref_name, 'dll-')
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract DLL Version From Tag
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^dll-v?', ''
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Configure AetherDLL
        run: cmake --preset x64-Release
        working-directory: AetherDLL

      - name: Build AetherDLL
        run: cmake --build --preset x64-Release
        working-directory: AetherDLL

      - name: Package AetherDLL Zip
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $source = "AetherDLL/out/build/x64-Release/out/Release"
          if (!(Test-Path $source)) {
            throw "DLL output folder not found: $source"
          }
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path "$source/*" -DestinationPath "release/AetherDLL-$version.zip" -Force
          @{
            component = "AetherDLL"
            version = $version
            tag = "${{ github.ref_name }}"
            published_at = (Get-Date).ToUniversalTime().ToString("o")
          } | ConvertTo-Json | Set-Content "release/latest-dll.json"

      - name: Publish DLL Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: AetherDLL ${{ steps.version.outputs.version }}
          body: Automated AetherDLL release compiled on GitHub Actions.
          draft: false
          prerelease: false
          files: |
            release/AetherDLL-${{ steps.version.outputs.version }}.zip
            release/latest-dll.json
